name: satellite-watcher

services:
  map:
    image: joseluisq/static-web-server
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MAP_PUBLISHED_PORT:-8502}:80"
    volumes:
      - ./tests/data/tiles:/tiles
    environment:
      SERVER_ROOT: /tiles

  detectorlitter:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11-slim}
        API_PORT: ${API_PORT:-8080}
    ports:
      - "${API_PUBLISHED_PORT:-8000}:${API_PORT:-8080}"
    env_file:
      - ./config/server.env
      - ./.env
      - ./config/compose-server.env

  demo:
    build:
      context: .
      dockerfile: demo.Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11-slim}
        DEMO_PORT: ${DEMO_PORT:-8501}
    ports:
      - "${DEMO_PUBLISHED_PORT:-8501}:${DEMO_PORT:-8501}"
    env_file:
      - ./config/demo.env
      - ./.env
      - ./config/compose-demo.env
    depends_on:
      detectorlitter:
        condition: service_healthy
    profiles: ["demo"]
