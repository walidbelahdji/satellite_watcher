name: ci

on:
  push:
    branches: ["prod"]
  pull_request:
    branches: ["prod"]

jobs:
  fmt-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
      - name: Install dependencies
        run: pip install black ruff
      - name: Check fmt
        run: black . --check
      - name: Check lint
        run: ruff check .
  secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: trufflesecurity/trufflehog@main
  sast:
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v3
      - run: semgrep ci --config auto --metrics off --supply-chain