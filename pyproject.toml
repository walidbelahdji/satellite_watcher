[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detectorLitter"
version = "0.0.0"
description = "Waste detection from photos and satellite tiles"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["detectorLitter*"]
